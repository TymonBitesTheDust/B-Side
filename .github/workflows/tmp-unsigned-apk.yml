# One-off: builds the B-Side APK unsigned and commits it to this temporary branch. Deleted right after.
name: One-off unsigned APK
on:
  push:
    branches: [tmp/apk-1.10.0]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          python3 web/build.py
          git diff --exit-code -- web/index.html docs/index.html
          BT="$ANDROID_HOME/build-tools/34.0.0"; PLATFORM="$ANDROID_HOME/platforms/android-34"
          mkdir -p "$RUNNER_TEMP/tools"
          cp "$BT/aapt2" "$BT/lib/d8.jar" "$BT/lib/apksigner.jar" "$PLATFORM/android.jar" "$RUNNER_TEMP/tools/"
          curl -fsSL -o "$RUNNER_TEMP/tools/ecj.jar" https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar
          TOOLS="$RUNNER_TEMP/tools" KEYSTORE="$RUNNER_TEMP/throwaway.jks" KS_PASS=throwaway android/build.sh
          "$RUNNER_TEMP/tools/aapt2" dump badging android/build/aligned.apk | grep -E "^(package|application-label):"
          sha256sum android/build/aligned.apk
          cp android/build/aligned.apk android/build/B-Side-unsigned.apk
      - name: Commit it to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p out && cp android/build/B-Side-unsigned.apk out/
          git add -f out/B-Side-unsigned.apk
          git commit -m "Unsigned APK (temporary)"
          git push origin HEAD:tmp/apk-1.10.0
