<style>
:root{
  --font:"SamsungOne","Samsung Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#f3f3f6; --surface:#ffffff; --surface-2:#e8e8ee; --elev:#ffffff;
  --text:#121216; --text-2:#686872; --text-3:#9d9da6; --line:rgba(17,17,22,.08);
  --press:rgba(17,17,22,.07); --hover:rgba(17,17,22,.035); --track:rgba(17,17,22,.13);
  --accent:#2f6bff; --accent-rgb:47,107,255; --on-accent:#ffffff; --accent-soft:rgba(47,107,255,.12);
  --danger:#e5484d; --scrim:rgba(8,8,12,.42);
  --toast-bg:#26262b; --toast-fg:#fff;
  --shadow:0 14px 34px rgba(20,20,45,.16);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --radius:26px; --ease:cubic-bezier(.2,.9,.25,1);
  --hero-h:clamp(160px,30vh,290px);
  --art:min(84vw,46vh,440px);
  --tint:110,130,255;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#030304; --surface:#151517; --surface-2:#242428; --elev:#1b1b1e;
    --text:#f2f2f5; --text-2:#a0a0aa; --text-3:#6e6e78; --line:rgba(255,255,255,.08);
    --press:rgba(255,255,255,.09); --hover:rgba(255,255,255,.045); --track:rgba(255,255,255,.16);
    --accent:#6b98ff; --accent-rgb:107,152,255; --on-accent:#06102b; --accent-soft:rgba(107,152,255,.16);
    --danger:#ff6b6f; --scrim:rgba(0,0,0,.6); --toast-bg:#ececf1; --toast-fg:#121216;
    --shadow:0 14px 34px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#030304; --surface:#151517; --surface-2:#242428; --elev:#1b1b1e;
  --text:#f2f2f5; --text-2:#a0a0aa; --text-3:#6e6e78; --line:rgba(255,255,255,.08);
  --press:rgba(255,255,255,.09); --hover:rgba(255,255,255,.045); --track:rgba(255,255,255,.16);
  --accent:#6b98ff; --accent-rgb:107,152,255; --on-accent:#06102b; --accent-soft:rgba(107,152,255,.16);
  --danger:#ff6b6f; --scrim:rgba(0,0,0,.6); --toast-bg:#ececf1; --toast-fg:#121216;
  --shadow:0 14px 34px rgba(0,0,0,.5); color-scheme:dark;
}
@media (min-width:900px),(max-height:560px){:root{--hero-h:150px}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--text);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;-webkit-user-select:text;user-select:text}
img{display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:-10px;top:0}
.ico{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px}
.ib{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;flex:none;position:relative;transition:background .15s,color .15s,opacity .15s}
.ib:active{background:var(--press)}
@media (hover:hover){.ib:hover{background:var(--hover)}}
.ib:disabled{opacity:.35;pointer-events:none}

/* header */
.hero{height:calc(var(--hero-h) + var(--sat));padding-top:var(--sat);display:flex;align-items:flex-end}
.hero .wrap{padding:0 30px 24px;opacity:var(--hk,1);transform:translateY(calc((1 - var(--hk,1)) * 12px))}
.hero h1{font-size:clamp(34px,8.6vw,46px);font-weight:500;letter-spacing:-.02em;line-height:1.08}
.hero p{margin-top:8px;color:var(--text-2);font-size:15px}
.appbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:var(--sat)}
.ab-in{height:56px;display:flex;align-items:center;gap:2px;padding:0 6px}
.ab-title{flex:1;min-width:0;font-size:19px;font-weight:600;padding-left:14px;opacity:var(--abt,0)}
#abBack{display:none}
body:not([data-mode="tabs"]) #abBack{display:inline-grid}
body:not([data-mode="tabs"]) .ab-title{opacity:1;padding-left:4px}
.ab-search{display:none;flex:1;min-width:0}
body[data-mode="search"] .ab-search{display:block}
body[data-mode="search"] .ab-title,body[data-mode="search"] .ab-actions{display:none}
.ab-search input{width:100%;height:44px;border:0;border-radius:22px;background:var(--surface);color:var(--text);padding:0 18px;font-size:16px;outline:none}
.ab-search input::placeholder{color:var(--text-3)}
.ab-actions{display:flex}
body[data-mode="detail"] #abSearchBtn,body[data-mode="detail"] #abAdd{display:none}
.tabs{position:sticky;top:calc(56px + var(--sat));z-index:19;background:var(--bg)}
.tabs-in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0 10px 4px}
.tabs-in::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:10px 12px 16px;font-size:16px;font-weight:600;color:var(--text-3);transition:color .2s}
.tab.on{color:var(--text)}
@media (max-width:430px){.tabs-in{padding:0 7px 4px}.tab{padding:10px 9px 16px;font-size:15px}}
.tab::after{content:"";position:absolute;left:50%;bottom:7px;width:0;height:3px;border-radius:3px;background:var(--accent);transform:translateX(-50%);transition:width .25s var(--ease)}
.tab.on::after{width:20px}
body:not([data-mode="tabs"]) .hero,body:not([data-mode="tabs"]) .tabs{display:none}
.view{padding-top:6px;padding-bottom:calc(118px + var(--sab));min-height:calc(100vh - 56px - var(--sat))}

/* lists */
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden}
.list{padding:6px 0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:8px 4px 8px 14px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 70px;transition:background .12s}
.row:active{background:var(--press)}
@media (hover:hover){.row:hover{background:var(--hover)}}
.thumb{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2)}
.thumb img,.cover img,.dcover img,.mini-art img,.np-art img{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.94)}
.ph .ico{width:42%;height:42%}
.round{border-radius:50%}
.meta{flex:1;min-width:0}
.meta .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums;flex:none}
.num{width:30px;text-align:center;flex:none;color:var(--text-3);font-variant-numeric:tabular-nums;font-size:15px}
.row .more{color:var(--text-3)}
.row.on .meta .t,.row.on .num{color:var(--accent)}
.bars{display:none;width:16px;height:15px;align-items:flex-end;gap:2px;flex:none}
.bars i{flex:1;background:var(--accent);border-radius:2px;height:35%;animation:eqb .9s ease-in-out infinite;animation-play-state:paused}
.bars i:nth-child(2){animation-delay:-.35s}.bars i:nth-child(3){animation-delay:-.65s}
body.is-playing .bars i{animation-play-state:running}
@keyframes eqb{0%,100%{height:28%}50%{height:100%}}
.row.on .bars{display:flex}.row.on .dur{display:none}
.chev{color:var(--text-3);margin-right:8px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 14px}
.pill{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 14px;border-radius:21px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill .ico{width:20px;height:20px}
.pill b{font-weight:500;opacity:.7}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;color:var(--text-2);font-size:14px;font-weight:500}
.chip .ico{width:18px;height:18px}
.chip:active{background:var(--press)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:22px 8px 10px;font-size:15px;font-weight:600;color:var(--text-2)}
.sec-h:first-child{padding-top:6px}
.hint{padding:44px 24px;text-align:center;color:var(--text-2);line-height:1.5}

/* albums */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 14px;padding:2px}
@media (max-width:440px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:block;min-width:0;border-radius:20px}
.cover{width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:var(--surface-2)}
.tile .tn{margin-top:10px;font-weight:600;font-size:15px}
.tile .ts{font-size:13px;color:var(--text-2);margin-top:2px}
.tile:active .cover{transform:scale(.97)}
.cover{transition:transform .15s}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .tile{width:148px;flex:none;scroll-snap-align:start}

/* playlists */
.autos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:760px){.autos{grid-template-columns:repeat(4,1fr)}}
.auto{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:116px;padding:16px;border-radius:24px;background:var(--surface);transition:transform .15s}
.auto:active{transform:scale(.98)}
.auto .ab{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;color:#fff}
.auto b{display:block;font-size:16px;font-weight:600}
.auto span{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic>*{width:100%;height:100%;border-radius:0!important;overflow:hidden;min-width:0}
.mosaic img{width:100%;height:100%;object-fit:cover}
.mosaic .ph .ico{width:50%;height:50%}
.txt-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;font-weight:600;color:var(--accent);font-size:15px}
.txt-btn:active{background:var(--accent-soft)}
.txt-btn .ico{width:20px;height:20px}
.txt-btn.danger{color:var(--danger)}

/* detail */
.dhead{display:flex;gap:20px;align-items:flex-end;padding:6px 6px 18px}
.dcover{width:clamp(124px,32vw,210px);aspect-ratio:1/1;border-radius:26px;overflow:hidden;flex:none;box-shadow:var(--shadow);background:var(--surface-2)}
.dcover.round{border-radius:50%}
.dinfo{min-width:0;flex:1;padding-bottom:4px}
.dinfo .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.dinfo h2{font-size:clamp(22px,5.6vw,34px);font-weight:600;line-height:1.15;margin:6px 0;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dinfo p{color:var(--text-2);font-size:14px}
.dacts{display:flex;gap:10px;align-items:center;padding:0 2px 16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px 0 18px;border-radius:23px;font-weight:600;font-size:15px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn .ico{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.tonal{background:var(--accent-soft);color:var(--accent)}
.dacts .grow{flex:1}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 20px 40px}
.empty-art{width:132px;height:132px;border-radius:40px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ic-a,#6e8dff),var(--ic-b,#3d5cf5) 55%,var(--ic-c,#7a4cf2));box-shadow:0 22px 46px rgba(var(--accent-rgb),.32);margin-bottom:28px}
.empty-art .ico{width:58px;height:58px}
.empty h2{font-size:22px;font-weight:700}
.empty p{color:var(--text-2);margin:10px auto 26px;max-width:340px;line-height:1.5}
.empty .btns{display:flex;flex-direction:column;gap:10px;width:min(100%,300px)}
.empty .btn{height:52px;border-radius:26px}
.empty small{margin-top:20px;color:var(--text-3);font-size:13px;line-height:1.5;max-width:320px}

/* mini player */
.mini{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + var(--sab));max-width:760px;margin:0 auto;height:70px;border-radius:24px;background:var(--elev);box-shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px var(--line);display:flex;align-items:center;padding:0 6px 0 9px;transform:translateY(calc(100% + 40px));transition:transform .35s var(--ease);overflow:hidden}
body.has-mini .mini{transform:none}
.mini-hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:100%;cursor:pointer}
.mini-art{width:50px;height:50px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface-2)}
.mini-meta{min-width:0;flex:1}
.mini-meta .t{font-weight:600;font-size:15px}
.mini-meta .s{font-size:13px;color:var(--text-2);margin-top:2px}
.mini .ib .ico{width:26px;height:26px}
.mini-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(var(--accent),var(--accent)) left center/var(--p,0%) 100% no-repeat}
.i-pause{display:none}
body.is-playing .i-play{display:none}
body.is-playing .i-pause{display:block}

/* now playing */
.np{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:var(--sat) 0 var(--sab);transform:translateY(102%);visibility:hidden;transition:transform .42s var(--ease),visibility 0s linear .42s;overflow:hidden}
.np.open{transform:none;visibility:visible;transition:transform .42s var(--ease),visibility 0s}
.np.dragging{transition:none}
.np-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 78% at 50% 0%,rgba(var(--tint),.5),rgba(var(--tint),.12) 55%,rgba(var(--tint),0) 80%);transition:opacity .4s}
:root[data-theme="dark"] .np-bg{background:radial-gradient(130% 80% at 50% 0%,rgba(var(--tint),.46),rgba(var(--tint),.1) 58%,rgba(var(--tint),0) 82%)}
.np>*:not(.np-bg):not(.np-deco){position:relative}
.np-top{display:flex;align-items:center;gap:6px;height:60px;padding:0 10px;flex:none}
.np-from{text-align:center;min-width:0;flex:1}
.np-from span{display:block;font-size:12px;color:var(--text-2);letter-spacing:.03em}
.np-from b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:0 26px 10px;gap:8px}
.np-stage{position:relative;width:var(--art);height:var(--art);flex:none;touch-action:none}
.np-art{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.26);background:var(--surface-2);will-change:transform}
.np-art .ph .ico{width:34%;height:34%}
.np-lyrics{display:none;position:absolute;inset:0;overflow:auto;padding:24px 4px 40%;-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 8%,#000 82%,transparent);scrollbar-width:none;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.np-lyrics::-webkit-scrollbar{display:none}
.np-lyrics p{font-size:17px;line-height:1.55;margin:0 0 6px;white-space:pre-wrap;color:var(--text)}
.np-lyrics.synced p{font-size:23px;font-weight:600;line-height:1.3;margin:0 0 16px;color:var(--text-3);transition:color .3s;cursor:pointer}
.np-lyrics.synced p.on{color:var(--text)}
.np-lyrics .none{color:var(--text-2);text-align:center;padding-top:30%;font-size:16px;line-height:1.5}
.np.show-lyrics .np-stage{width:min(100%,560px);height:auto;flex:1;align-self:stretch;margin:0 auto;touch-action:pan-y}
.np.show-lyrics .np-art{display:none}
.np.show-lyrics .np-lyrics{display:block}
.np-panel{width:min(100%,520px);flex:none}
.np-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.np-titles{flex:1;min-width:0}
.np-title{font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;line-height:1.25}
.np-title span{display:inline-block}
.np-title.marq{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.np-title.marq span{animation:marq var(--mdur,12s) linear infinite}
@keyframes marq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--d,0))}}
.np-artist{display:block;max-width:100%;font-size:16px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#npFav.on{color:#ff4d6d}
#npFav.on .ico{fill:currentColor}
.seek{margin:2px 0 0}
.seek input{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;--p:0%;touch-action:none}
.seek input:focus{outline:none}
.seek input::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p),var(--track) var(--p))}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--accent);margin-top:-6px;border:0;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.seek input::-moz-range-track{height:5px;border-radius:5px;background:var(--track)}
.seek input::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
.seek input::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;background:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;margin-top:-1px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin:10px -8px 6px}
.ctrls .big{width:62px;height:62px}
.ctrls .big .ico{width:34px;height:34px}
.play{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px rgba(var(--accent-rgb),.36);transition:transform .15s}
.play:active{transform:scale(.93)}
.play .ico{width:36px;height:36px}
.tg{color:var(--text-2)}
.tg.on{color:var(--accent)}
.tg.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.vol{display:none;align-items:center;gap:10px;color:var(--text-2);margin:2px 0 0}
.vol .seek{flex:1;margin:0}
@media (hover:hover) and (pointer:fine){.vol{display:flex}}
.np-acts{display:flex;justify-content:space-around;margin-top:8px;color:var(--text-2)}
.np-acts .on{color:var(--accent)}
[hidden]{display:none!important}
.ord-list{padding:2px 0 8px}
.ord-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 6px 0 4px;border-radius:16px;background:var(--elev);transition:transform .18s var(--ease);position:relative}
.ord-row.drag{transition:none;z-index:2;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.ord-row .oh{touch-action:none;cursor:grab;color:var(--text-3)}
.ord-row .ol{flex:1;min-width:0;font-size:16px;display:flex;align-items:center;gap:14px}
.ord-row .ol .ico{color:var(--text-2)}
.ord-row.off .ol{color:var(--text-3)}
.ord-row .switch{cursor:pointer}
.sep-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 10px}
.split-demo{margin:2px 16px 12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:14px;line-height:1.5}
.split-demo b{font-weight:600}
.split-demo .arrow{color:var(--text-3);margin:0 6px}
.split-demo .tag{display:inline-block;padding:1px 9px;margin:2px 4px 2px 0;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.keep-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 6px 0 16px;font-size:15px}
.keep-row span{flex:1;min-width:0}
.keep-row .ib{color:var(--text-3)}
.badge{position:absolute;top:0;right:-6px;font-size:10px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:1px 5px;display:none;line-height:1.4}
.badge.show{display:block}
.spd{font-size:14px;font-weight:700;letter-spacing:-.02em}
@media (min-width:880px) and (min-aspect-ratio:1/1){
  :root{--art:min(40vw,60vh,520px)}
  .np-body{flex-direction:row;justify-content:center;gap:clamp(40px,7vw,110px);padding:0 48px 36px}
  .np-panel{width:420px}
  .np.show-lyrics .np-stage{height:min(70vh,640px);flex:none;width:min(46vw,560px);align-self:center;margin:0}
}
@media (max-height:660px) and (max-aspect-ratio:1/1){:root{--art:min(74vw,36vh)}.play{width:64px;height:64px}.ctrls{margin:4px -8px 2px}}

/* sheets & dialogs */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:70;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:min(86vh,780px);display:flex;flex-direction:column;background:var(--elev);border-radius:30px 30px 0 0;padding-bottom:calc(10px + var(--sab));transform:translateY(105%);visibility:hidden;transition:transform .34s var(--ease),visibility 0s linear .34s;box-shadow:0 -10px 40px rgba(0,0,0,.16)}
.sheet.open{transform:none;visibility:visible;transition:transform .34s var(--ease),visibility 0s}
.sheet.dragging{transition:none}
@media (min-width:700px) and (min-height:600px){.sheet{bottom:24px;border-radius:30px;max-width:560px;padding-bottom:10px;transform:translateY(calc(100% + 40px))}}
.grip{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.grip::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--text-3);opacity:.45}
.sh-head{display:flex;align-items:center;gap:12px;padding:6px 18px 10px 22px;flex:none;touch-action:none}
.sh-head h3{font-size:19px;font-weight:700;flex:1;min-width:0}
.sh-head small{display:block;color:var(--text-2);font-size:13px;font-weight:400;margin-top:2px}
.sh-track{display:flex;gap:14px;align-items:center;padding:4px 22px 14px;flex:none;touch-action:none}
.sh-track .thumb{width:56px;height:56px}
.sh-track .t{font-size:17px;font-weight:600}
.sheet-body{overflow:auto;overscroll-behavior:contain;padding:0 10px 6px;min-height:0}
.mi{display:flex;align-items:center;gap:18px;width:100%;min-height:54px;padding:12px 16px;border-radius:18px;font-size:16px;transition:background .12s}
.mi:active{background:var(--press)}
@media (hover:hover){.mi:hover{background:var(--hover)}}
.mi .ico{color:var(--text-2)}
.mi .mt{flex:1;min-width:0}
.mi .sub{display:block;font-size:13px;color:var(--text-2);margin-top:2px}
.mi.danger,.mi.danger .ico{color:var(--danger)}
.mi.sel{color:var(--accent)}
.mi.sel .ico{color:var(--accent)}
.mi .thumb{width:44px;height:44px;border-radius:12px}
.sep{height:1px;background:var(--line);margin:6px 16px}
.lbl{font-size:13px;font-weight:600;color:var(--text-2);padding:12px 16px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 12px}
.chipb{height:38px;padding:0 16px;border-radius:19px;background:var(--surface-2);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.chipb.on{background:var(--accent);color:var(--on-accent)}
.switch{width:52px;height:30px;border-radius:15px;background:var(--track);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(22px)}
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;margin:2px 12px 10px}

.band{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.band .hit{flex:1;width:44px;display:flex;justify-content:center;touch-action:none;cursor:pointer;position:relative}
.band .trk{position:relative;width:6px;height:100%;border-radius:6px;background:var(--surface-2)}
.band .mid{position:absolute;left:-5px;right:-5px;top:50%;height:2px;background:var(--track)}
.band .fill{position:absolute;left:0;right:0;border-radius:6px;background:var(--accent)}
.band .knob{position:absolute;left:50%;width:22px;height:22px;border-radius:50%;background:var(--elev);border:3px solid var(--accent);transform:translate(-50%,50%);box-shadow:0 2px 6px rgba(0,0,0,.18)}

.dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px 24px calc(24px + var(--sab));background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}

.dlg{width:min(100%,400px);background:var(--elev);border-radius:28px;padding:24px 20px 12px;transform:scale(.95);transition:transform .22s var(--ease)}
.dialog.open .dlg{transform:none}
.dlg h3{font-size:19px;font-weight:700;margin:0 4px 8px}
.dlg p{color:var(--text-2);font-size:15px;line-height:1.45;margin:0 4px}
.field{width:100%;height:50px;margin-top:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;padding:0 14px;outline:none}

.toast.show{opacity:1;transform:translate(-50%,0)}
body.has-mini .toast{bottom:calc(96px + var(--sab))}
body.np-open .toast{bottom:calc(24px + var(--sab))}
.drop{position:fixed;inset:12px;z-index:95;border-radius:32px;border:3px dashed var(--accent);background:rgba(var(--accent-rgb),.10);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;font-size:20px;font-weight:600;color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ───────────────────────── game styles: shared hooks ─────────────────────────
   One app, many skins (see the Game UI theme guide): base components read only tokens; each style
   lives in its own file under web/skins/, every rule scoped to [data-skin="…"]. Pieces only one style
   uses are hidden everywhere else. */
:root{--display:var(--font)}
.hero h1,.ab-title,.tab,.dinfo h2,.np-title,.sh-head h3,.dlg h3,.empty h2,.sec-h,.tile .tn,.auto b,.btn,.pill,.lbl,.np-from b,.crumbs{font-family:var(--display)}
.hero{position:relative}
.hero,.view{z-index:1}
.view{position:relative;overflow-x:clip}
.deco,.fx,.wipe,.ribbon,.key-hints,.fr-counter,.hl,.ransom,.done-fx,.starfield{display:none;pointer-events:none}
.deco{position:fixed;inset:0;z-index:0;overflow:hidden}
.np-deco{position:absolute}
.fx{position:fixed;inset:0;z-index:46}
.wipe{position:fixed;inset:0;z-index:98;overflow:hidden}
.wipe i{position:absolute;display:block}
.starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.done-fx{position:fixed;inset:0;z-index:96;display:grid;place-items:center;overflow:hidden}
.hero .hs-n{font-weight:inherit}
:root[data-skin]:not([data-skin="bside"]) .np-bg{display:none}
@media (prefers-reduced-motion:reduce){.wipe,.done-fx{display:none!important}.deco::before,.deco::after{animation:none!important}}
[data-motion="reduced"] .wipe,[data-motion="reduced"] .done-fx{display:none!important}

/* style picker */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;padding:2px 12px 12px}
.sk-card{display:flex;flex-direction:column;gap:8px;padding:7px 7px 10px;border-radius:20px;background:var(--surface-2);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,transform .15s;min-width:0}

.sk-pv .h{height:11px;width:58%;margin-bottom:3px}
.sk-pv .r{height:12px}
.sk-pv .m{position:absolute;left:7px;right:7px;bottom:7px;height:15px}
.sk-pv.bside{background:#f3f3f6}
.sk-pv.bside .h{background:#121216;border-radius:3px!important}
.sk-pv.bside .r{background:#fff;border-radius:4px!important;box-shadow:inset 12px 0 #c8d5ff}
.sk-pv.bside .m{background:#fff;border-radius:8px!important;box-shadow:0 2px 6px rgba(0,0,0,.12),inset -14px 0 #2f6bff}

.sk-pv.archive .h{background:#57544a;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.sk-pv.archive .r{background:linear-gradient(#57544a,#57544a) 4px 50%/5px 5px no-repeat,rgba(180,175,154,.7)}
.sk-pv.archive .r:nth-child(3){background:linear-gradient(#dad4bb,#dad4bb) 4px 50%/5px 5px no-repeat,#57544a;box-shadow:0 -3px 0 -1px #57544a,0 3px 0 -1px #57544a}
.sk-pv.archive .m{background:#dad4bb;box-shadow:inset 0 0 0 1px #8a8572,4px 4px 0 rgba(0,0,0,.16)}
.sk-pv.riot{background:#4b0007}
.sk-pv.riot::after{content:"";position:absolute;right:-8px;top:0;bottom:0;width:48%;background:repeating-radial-gradient(circle at 70% 50%,#e5191c 0 5px,#0b0002 5px 10px);clip-path:polygon(34% 0,100% 0,100% 100%,0 100%)}
.sk-pv.riot i{position:relative;z-index:1}
.sk-pv.riot .h{background:linear-gradient(90deg,#e5191c 0 18%,#fff 18% 40%,#0b0a0a 40% 44%,#fff 44% 68%,#e5191c 68%);transform:rotate(-3deg);width:52%}
.sk-pv.riot .r{background:#0b0a0a;box-shadow:0 0 0 1.5px #fff;clip-path:polygon(0 20%,100% 0,98% 100%,1% 88%);margin-right:24%}
.sk-pv.riot .r:nth-child(3){box-shadow:-4px 2px 0 #00e8ff,4px -2px 0 #e5191c,0 0 0 1.5px #fff}
.sk-pv.riot .m{background:#0b0a0a;box-shadow:0 0 0 2px #fff,4px 4px 0 2px #e5191c}
.sk-pv.tide{background:linear-gradient(180deg,#2fd2ff,#1a7ff0 35%,#1438c4 75%,#0b1c82)}
.sk-pv.tide .h{background:#fff;transform:rotate(-5deg) skew(-14deg);width:46%;box-shadow:inset 0 0 0 1.5px #050816}
.sk-pv.tide .r{background:linear-gradient(112deg,#6ae6fb 0 8px,#05070f 8.5px);clip-path:polygon(0 0,100% 0,94% 100%,0 100%)}
.sk-pv.tide .r:nth-child(3){background:#fff;box-shadow:0 0 0 1.5px #ff1f3d;margin-left:6px}
.sk-pv.tide .m{background:rgba(3,6,18,.88);box-shadow:inset 0 0 0 1px rgba(200,240,255,.55)}
.sk-pv.frontier{background:#e6d7b6}
.sk-pv.frontier .h{background:#1a1410;width:62%;height:12px;border-radius:30% 10% 40% 20%!important}
.sk-pv.frontier .r{background:rgba(76,48,20,.16)}
.sk-pv.frontier .r:nth-child(3){box-shadow:0 0 0 2px #cc0000}
.sk-pv.frontier .m{background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),#0a0806}
.sk-pv.neon{background:#0a0b11}

.sk-pv.neon .m{background:#07080d;box-shadow:inset 0 0 0 1px rgba(255,95,86,.55),inset 3px 0 0 #fcee0a;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,0 100%)}
.sk-card[data-skin-k="archive"] b{font-family:"Manrope",var(--font);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:12.5px;padding-top:2px}
.sk-card[data-skin-k="riot"] b{font-family:"Anton",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:16px}
.sk-card[data-skin-k="tide"] b{font-family:"Montserrat",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:15px}

.sfx-tests{display:flex;flex-wrap:wrap;gap:8px;padding:2px 12px 12px}

/* theme colour + app icon */
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:4px 14px 12px}
.sw{width:40px;height:40px;border-radius:50%!important;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s,box-shadow .15s}

/* folder explorer */
.crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 2px 12px;white-space:nowrap;font-size:14px}
.crumbs::-webkit-scrollbar{display:none}

/* fast scroll: a drag handle, or an A–Z rail, on the right edge (Settings → Layout → Fast scroll).
   JS sets top and height to the space between the header and the mini player. */
.fscroll{position:fixed;z-index:24;top:0;height:0;right:max(0px,calc((100% - 1040px) / 2 - 34px));width:34px;pointer-events:none}
.fs-thumb{position:absolute;right:0;top:0;width:34px;height:52px;display:flex;justify-content:flex-end;padding:0 4px 0 0;touch-action:none;cursor:grab;opacity:0;pointer-events:none;transition:opacity .3s;will-change:transform}
.fs-thumb i{display:block;width:6px;height:100%;border-radius:4px;background:var(--text-3);opacity:.75;transition:width .15s,background .15s,opacity .15s}
.fscroll.show .fs-thumb,.fscroll.drag .fs-thumb{opacity:1;pointer-events:auto}
.fscroll.drag .fs-thumb{cursor:grabbing}
.fscroll.drag .fs-thumb i,.fs-thumb:hover i{width:9px;background:var(--accent);opacity:1}
.fs-rail{position:absolute;right:3px;top:50%;width:26px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:stretch;padding:4px 0;border-radius:13px;pointer-events:auto;touch-action:none;cursor:pointer;transition:background .15s}
.fs-rail b{flex:1;min-height:0;display:grid;place-items:center;font-size:11px;font-weight:700;line-height:1;color:var(--text-2);font-family:var(--display);transition:color .12s}
.fs-rail b.dot{font-size:7px;color:var(--text-3)}
.fs-rail b.on{color:var(--accent)}
.fscroll.drag .fs-rail{background:var(--surface-2)}
.fscroll[data-m="bar"] .fs-rail,.fscroll[data-m="letters"] .fs-thumb{display:none}
.fs-bubble{position:absolute;right:52px;top:0;min-width:64px;height:64px;padding:0 16px;margin-top:-32px;display:grid;place-items:center;border-radius:32px 32px 6px 32px;background:var(--accent);color:var(--on-accent);font:700 32px/1 var(--display);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;transform:scale(.7);transform-origin:100% 50%;transition:opacity .15s,transform .15s var(--ease)}
.fscroll.drag .fs-bubble.on{opacity:1;transform:none}
body.np-open .fscroll{visibility:hidden}
@media (max-width:1119px){body.fs-index .view{padding-right:40px}}

/* ==========================================================================
   NieR: Automata (id "archive"): a YoRHa menu. Beige paper on a fine grid,
   dark-brown ink, light-brown plates with small square markers. Whatever you
   point at fills dark from the left while thin lines slide out above and
   below; the chosen tab and the playing song stay filled. Wide-tracked titles
   with an offset shadow and a dashed rule, light-brown header bands, dark
   header bands on panels, two-bar footers, faint scanlines and a short glitch
   as a page comes up. The square locks on when a song is liked.
   "Paper" (light) and "Ink" (dark).
   ========================================================================== */

:root[data-skin="archive"] {
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Manrope", var(--font);
  --bg: #d1cdb7; --surface: #dad4bb; --surface-2: #c4bfa6; --elev: #dad4bb;
  --text: #4e4b42; --text-2: #57544a; --text-3: #4e4b42;
  --line: #b4af9a; --line-strong: #8a8572;
  --press: rgba(87, 84, 74, .16); --hover: rgba(87, 84, 74, .1); --track: rgba(87, 84, 74, .25);
  --accent: #57544a; --accent-rgb: 87, 84, 74; --on-accent: #dad4bb; --accent-soft: #b4af9a;
  --danger: #a5463b; --scrim: rgba(52, 50, 44, .42);
  --toast-bg: #57544a; --toast-fg: #dad4bb;
  --shadow: 8px 8px 0 rgba(0, 0, 0, .16);
  --na-row: rgba(180, 175, 154, .46); --na-grid: rgba(150, 144, 120, .17); --na-vignette: rgba(120, 113, 92, .32);
  --na-scan: rgba(60, 56, 46, .035); --na-shadow: rgba(0, 0, 0, .17); --na-on-ink: #dad4bb; --na-on-muted: #c4bfa6; --spark: #cd664d;
  color-scheme: light;
}
:root[data-skin="archive"][data-theme="dark"] {
  --bg: #1f1e1a; --surface: #2b2a25; --surface-2: #3a3832; --elev: #2b2a25;
  --text: #dad4bb; --text-2: #c9c3aa; --text-3: #a49e89;
  --line: #3d3b34; --line-strong: #6c6859;
  --press: rgba(218, 212, 187, .12); --hover: rgba(218, 212, 187, .07); --track: rgba(218, 212, 187, .22);
  --accent: #dad4bb; --accent-rgb: 218, 212, 187; --on-accent: #2b2a25; --accent-soft: #3a3832;
  --danger: #e08a73; --scrim: rgba(0, 0, 0, .55);
  --toast-bg: #dad4bb; --toast-fg: #2b2a25;
  --shadow: 8px 8px 0 rgba(0, 0, 0, .45);
  --na-row: rgba(180, 175, 154, .1); --na-grid: rgba(218, 212, 187, .045); --na-vignette: rgba(0, 0, 0, .55);
  --na-scan: rgba(0, 0, 0, .08); --na-shadow: rgba(0, 0, 0, .45); --na-on-ink: #2b2a25; --na-on-muted: #57544a; --spark: #e08a73;
  color-scheme: dark;
}

/* ---------- surface: grid paper, vignette, scanlines ---------- */

[data-skin="archive"] *, [data-skin="archive"] *::before, [data-skin="archive"] *::after { border-radius: 0 !important; }
[data-skin="archive"] body, [data-skin="archive"] .np {
  letter-spacing: .01em; background-color: var(--bg);
  background-image: radial-gradient(140% 120% at 50% 35%, transparent 52%, var(--na-vignette) 100%), linear-gradient(to right, var(--na-grid) 1px, transparent 1px), linear-gradient(to bottom, var(--na-grid) 1px, transparent 1px);
  background-size: 100% 100%, .3rem .3rem, .3rem .3rem; background-attachment: fixed;
}
[data-skin="archive"] .fx { display: block; z-index: 99; background: repeating-linear-gradient(to bottom, var(--na-scan) 0 1px, transparent 1px 3px); }
[data-skin="archive"] ::selection { background: var(--accent); color: var(--on-accent); }
[data-skin="archive"] button:focus-visible, [data-skin="archive"] [tabindex]:focus-visible { outline: 2px solid var(--text); }

/* ---------- the NieR plate: fills dark from the left, lines slide out above and below ---------- */

[data-skin="archive"] .tab, [data-skin="archive"] .row, [data-skin="archive"] .btn.tonal, [data-skin="archive"] .pill, [data-skin="archive"] .mi:not(.static), [data-skin="archive"] .auto {
  position: relative;
  background-color: transparent;
  background-image: linear-gradient(var(--accent), var(--accent)), linear-gradient(var(--na-row), var(--na-row));
  background-repeat: no-repeat; background-size: 0 100%, 100% 100%;
  transition: background-size .2s linear, color .2s linear;
}
[data-skin="archive"] .tab::after, [data-skin="archive"] .row::after, [data-skin="archive"] .btn.tonal::after, [data-skin="archive"] .pill::after, [data-skin="archive"] .btn.primary::after, [data-skin="archive"] .mi:not(.static)::after {

/* ---------- surface ---------- */

[data-skin="riot"] *, [data-skin="riot"] *::before, [data-skin="riot"] *::after { border-radius: 0 !important; }

[data-skin="riot"] ::selection { background: var(--red); color: #fff; }
