# Builds B-Side.apk and B-Side.html on GitHub, with the Android tools GitHub's machines already have.
#
# With the release key saved as two repository secrets (see docs/DEVELOPING.md → "Build on GitHub"):
#   BSIDE_KEYSTORE  your android/bside-release.jks, as base64
#   BSIDE_KS_PASS   its password
# the APK is signed with that key, so it installs over B-Side. Without them it builds "B-Side Test"
# (app.bside.music.test), which installs next to B-Side and can't update it.
#
# Every run keeps both files under the run's Artifacts. Pushing a tag like V1.10.0 also makes a draft release
# with both files attached, ready to publish.
name: Build B-Side

on:
  push:
    branches: [main]
    tags: ['V*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to draft a release when a V* tag is pushed

env:
  # the certificate every B-Side release so far was signed with; a release build must match it
  RELEASE_CERT_SHA256: 0eabd9696e0e39db005751547ef1b29399eed25e85e9c88213ecfef3ecf8a507
  ECJ_VERSION: 3.33.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the player
        run: |
          python3 web/build.py
          if ! git diff --quiet -- web/index.html docs/index.html; then
            echo "::error::web/index.html or docs/index.html is out of date. Run python3 web/build.py and commit the result."
            exit 1
          fi

      - name: Gather the Android tools
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34"
          if [ ! -d "$BT" ] || [ ! -f "$PLATFORM/android.jar" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          fi
          mkdir -p "$RUNNER_TEMP/tools"
          cp "$BT/aapt2" "$BT/lib/d8.jar" "$BT/lib/apksigner.jar" "$PLATFORM/android.jar" "$RUNNER_TEMP/tools/"
          curl -fsSL -o "$RUNNER_TEMP/tools/ecj.jar" \
            "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/$ECJ_VERSION/ecj-$ECJ_VERSION.jar"
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"

      - name: Build the app
        env:
          KEYSTORE_B64: ${{ secrets.BSIDE_KEYSTORE }}
          RELEASE_PASS: ${{ secrets.BSIDE_KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$RELEASE_PASS" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE="$RUNNER_TEMP/release.jks" KS_PASS="$RELEASE_PASS" android/build.sh
            rm -f "$RUNNER_TEMP/release.jks"
            KIND=release
          else
            echo "::warning::No release key in the repository secrets, so this is a test copy (B-Side Test, app.bside.music.test). It installs next to B-Side, not over it."
            KEYSTORE="$RUNNER_TEMP/test.jks" KS_PASS=test-copy-only TEST_PACKAGE=app.bside.music.test android/build.sh
            KIND=test
          fi
          cp web/index.html android/build/B-Side.html
          echo "KIND=$KIND" >> "$GITHUB_ENV"

      - name: Check the signature
        run: |
          "$TOOLS/aapt2" dump badging android/build/B-Side.apk | grep -E "^(package|application-label):"
          CERT=$(java -jar "$TOOLS/apksigner.jar" verify --print-certs android/build/B-Side.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signed with $CERT"
          if [ "$KIND" = release ] && [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::BSIDE_KEYSTORE isn't the key earlier releases were signed with, so this APK wouldn't install over B-Side."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: B-Side-${{ env.KIND }}
          path: |
            android/build/B-Side.apk
            android/build/B-Side.html
          if-no-files-found: error

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/V')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$KIND" != release ]; then
            echo "::error::Add the BSIDE_KEYSTORE and BSIDE_KS_PASS secrets first: a release needs the release key."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" android/build/B-Side.apk android/build/B-Side.html \
            --draft --title "B-Side $GITHUB_REF_NAME" --generate-notes
